id: missing-article-schema
category: schema
severity: low
confidence: low
detect:
  field: schema_types
  condition: list_not_contains
  value: Article
why: >
  Article schema declares the headline, author and publication dates in a
  machine-readable form, which helps search engines attribute and date
  editorial content correctly and can unlock richer result treatments.
fix:
  guidance: >
    If this is an article or blog post, add an Article (or BlogPosting)
    JSON-LD block with headline, author, datePublished, dateModified and
    image. This rule only applies to editorial pages; product and category
    pages should use their own types instead.
test:
  expect_fail: {schema_types: ["WebPage"]}
  expect_pass: {schema_types: ["Article", "BreadcrumbList"]}
