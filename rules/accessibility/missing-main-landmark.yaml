id: missing-main-landmark
category: accessibility
severity: medium
confidence: high
wcag: "1.3.1"
wcag_level: "A"
detect:
  field: has_main
  condition: is_false
why: >
  Without a main landmark, assistive technology cannot jump straight to
  the page's primary content. WCAG 1.3.1 expects structure and
  relationships to be conveyed programmatically, and landmarks are how
  that is done.
fix:
  guidance: >
    Wrap the primary content of each page in a single <main> element
    (or role="main" where the markup cannot be changed): <main
    id="main">...</main>. Keep headers, footers and sidebars outside it.
test:
  expect_fail: {has_main: false}
  expect_pass: {has_main: true}
