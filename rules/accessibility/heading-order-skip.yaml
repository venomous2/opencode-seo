id: heading-order-skip
category: accessibility
severity: medium
confidence: high
wcag: "1.3.1"
wcag_level: "A"
detect:
  field: heading_skips
  condition: gte
  value: 1
why: >
  Screen-reader users navigate by headings, and a jump from h1 to h3
  suggests content is missing and breaks the document outline.
  WCAG 1.3.1 requires the heading structure to reflect the real
  hierarchy.
fix:
  guidance: >
    Keep heading levels sequential — follow an h2 with an h3, not an
    h4. Choose heading levels by structure, not by how the text looks;
    restyle with CSS if a visually smaller heading is wanted.
test:
  expect_fail: {heading_skips: 1}
  expect_pass: {heading_skips: 0}
